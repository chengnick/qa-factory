[project]
name = "qa-factory"
version = "0.0.1"
description = "QA agent pipeline with tracing and rule-based failure attribution, evaluated against a seeded-bug TaskBoard SUT."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=2.0",
]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "playwright>=1.44",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests", "benchmark/reference_tests"]
pythonpath = ["."]
markers = [
    "ui: browser-driven test (Playwright)",
    "live: calls a real LLM API (needs QA_LIVE=1 and an API key)",
]
