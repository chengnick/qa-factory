# CI (spec v3.1 §15.5). No real LLM and no secrets: every test here is deterministic.
# Actions are pinned to commit SHAs; the comment gives the release the SHA belongs to.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install dependencies (lockfile)
        run: python -m pip install -r requirements.lock

      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Tests (no live LLM)
        run: python -m pytest -m "not live" -p no:cacheprovider --junitxml=junit.xml

      - name: Phase 0 acceptance matrix
        run: python -m benchmark.matrix

      - name: Upload evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-evidence-${{ matrix.os }}
          path: |
            junit.xml
            benchmark/results/phase0_matrix.md
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  canary:
    name: canary (Python 3.14, not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies (pyproject, not the lockfile)
        run: python -m pip install -e ".[dev,gemini]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Tests (no live LLM)
        run: python -m pytest -m "not live" -p no:cacheprovider
