    reason: the full-history secret scan found a Windows username in Phase 2R logs; the owner asked to mask it in future runs
    affects_frozen_fields: []
    changes: {}
    evaluation_impact: none on the 90 Phase 5 runs (already recorded); later runs would show [USER] in span content, traces, build logs and classification evidence; verdict logic unchanged

