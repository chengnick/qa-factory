# Changes made after the Phase 5 evaluation (spec v3 §3.3). Append-only: add new entries, never edit or delete
# old ones. benchmark/frozen.yaml itself is never changed.
#
# `python -m evaluation.frozen check --model gemini-3.5-flash-lite` lists these entries. An entry that changes a
# frozen field must name it in affects_frozen_fields and give {from, to} under changes; check then reports the
# difference as recorded (exit 3), while evaluation.run still refuses test-set runs on any difference.
# commits: the commits that made the change ([] when the change arrives in the same commit as its entry).

schema: 1
amendments:
  - id: A1
    date: 2026-09-29
    commits: [cc99a1d]
    files: [observability/redact.py, tests/observability/test_redact.py]
