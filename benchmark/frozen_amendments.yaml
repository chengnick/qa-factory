# frozen field must name it in affects_frozen_fields and give {from, to} under changes; check then reports the
# difference as recorded (exit 3), while evaluation.run still refuses test-set runs on any difference.
# commits: the commits that made the change ([] when the change arrives in the same commit as its entry).

